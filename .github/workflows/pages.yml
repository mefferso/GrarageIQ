name: Test and deploy GarageIQ
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check config.js
          node --check sw.js
          node --test tests/*.test.cjs
      - name: Build Pages release (cache version and PNG icons)
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python scripts/build_pages.py "${GITHUB_SHA}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
